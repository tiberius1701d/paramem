# Single source of truth for knowledge graph taxonomy.
# Edit this file to evolve entity types or relation types.
# Anchors document Schema.org/Wikidata lineage for future interop; unused at runtime today.

entity_types:
  person:        { anchor: "schema:Person" }
  place:         { anchor: "schema:Place" }
  organization:  { anchor: "schema:Organization" }
  event:         { anchor: "schema:Event" }
  preference:    { anchor: "internal" }
  concept:       { anchor: "schema:Thing" }

fallback_entity_type: concept

relation_types: [factual, temporal, preference, social, attribute]
fallback_relation_type: factual

# Anonymizer vocabulary — single source of truth for placeholder-prefix
# <-> entity-type resolution on the de-anonymization / repair path
# (paramem.config.taxonomy.entity_type_to_prefix / prefix_to_entity_type,
# via that module's anonymizer_type_to_prefix / anonymizer_prefix_to_type),
# AND — via `scrub_categories` — for grouping `sanitization.scrub` hints
# into the local anonymizer's SCAN categories
# (paramem.config.taxonomy.resolve_scrub_categories).
#
# Every row is also a keyword the anonymizer's SCAN call may answer with:
# the resident base model is shown every row's `prefix`/`description` pair
# (paramem.config.taxonomy.prefix_descriptions, in table order, whether
# the row is scrubbed or not) and returns each value it finds mapped to
# one of these keywords. Code then folds the returned keyword through
# canonical() and matches it exactly against a row's folded prefix: a
# value whose keyword names a row the operator's `scrub` activates is
# kept, every other value reverts.
#
# prefix           — the literal token ("Person", "City", etc.) and the
#                    keyword the SCAN call answers with. One word of
#                    letters, starting with a capital (PascalCase, no
#                    digits, no underscore) — this is also the mint's
#                    placeholder shape (`Prefix_N`) and the fold the
#                    keyword resolution matches against, so a looser
#                    shape would make either ambiguous. Config load
#                    refuses a row whose prefix does not match, and
#                    refuses two rows whose prefixes collide under either
#                    `casefold()` (the mint's rendering equivalence) or
#                    `canonical()` (the keyword resolution).
# entity_type      — the graph type that this prefix represents. Must be one
#                    of entity_types above — an undeclared entity_type fails
#                    config load. Multiple prefixes may map to the same
#                    entity_type (City → place, Country → place).
# description      — the keyword's one-line definition, in the model's own
#                    words — this file's readers and the SCAN call both
#                    read it verbatim; it is vocabulary, not instruction.
# primary_for_type — only one prefix per entity_type may set this. Used by
#                    the repair path to pick a canonical prefix when
#                    re-anonymizing a leaked real name; a second row
#                    setting it for the same entity_type fails config load.
# scrub_categories — optional list of `sanitization.scrub` hints this row
#                    serves. A configured hint claimed by this row activates
#                    this row: the operator's `sanitization.scrub` selection
#                    decides which rows the SCAN keep-or-revert step keeps. A
#                    hint claimed by two rows, an uncovered configured hint,
#                    or a hint whose `canonical()` form equals another row's
#                    folded prefix all fail config load. A row without
#                    `scrub_categories` can never be activated — its values
#                    always revert. An active row always carries at least
#                    the hint that activated it.
#
# This file is the ONE declaration of both vocabularies — every reader
# (relation types, entity types, the placeholder-prefix map, and
# `resolve_scrub_categories`) resolves through it, and a load failure
# (missing file, malformed YAML, a missing required key) is a hard
# failure at that reader's first use, never a silent fallback.
#
# The four contact-identifier rows below (Phone / Email / Address /
# Profile) declare `entity_type: person` even though they are not person
# NAMES — they are private identifiers OF a person, and `person` is the
# only closed-vocabulary entity_type structurally outside the
# entity-correction rewrite path
# (paramem.graph.entity_correction._CORRECTABLE), so a restored phone
# number, address, or handle is never routed through a "correction" that
# could mutate it. City / Country / Place are the OPPOSITE case: they
# declare `entity_type: place`, because a place name is NOT a private
# identifier of a person — it is a legitimately correctable entity class
# (`place` IS a member of `_CORRECTABLE`), so world-knowledge entity
# correction is exactly the repair pass a restored place name should be
# eligible for. Place carries no `scrub_categories` below — declaring one
# without a measured need would refuse config load the moment an operator
# activated it.
#
# Product / Room / Profession / Work carry `entity_type` values that ARE
# correctable (`concept` / `place` / `concept` / `concept`); Artist / Date /
# Other do not (`person` / `event` / `person`) — a musician or author name,
# a calendar date, and the catch-all (which may hold a private name) are
# the kinds this design keeps outside the entity-correction rewrite path.
# None of the seven set `primary_for_type` — the four primaries above
# already cover their entity types.
anonymizer:
  prefixes:
    - { prefix: Person,     entity_type: person,       description: "a person's given name, family name or full name (not a job title)", primary_for_type: true, scrub_categories: [person name, full name, given name, family name] }
    - { prefix: Phone,      entity_type: person,       description: "a telephone number",                               scrub_categories: [phone number, mobile number, landline number] }
    - { prefix: Email,      entity_type: person,       description: "an email address",                                 scrub_categories: [email address] }
    - { prefix: Address,    entity_type: person,       description: "a street address (street plus number, optionally postal code)", scrub_categories: [street address, postal address] }
    - { prefix: Profile,    entity_type: person,       description: "a profile URL or social-media handle",            scrub_categories: [profile URL, social media handle] }
    - { prefix: City,       entity_type: place,        description: "a city, town or village name",                     primary_for_type: true }
    - { prefix: Country,    entity_type: place,        description: "a country name" }
    - { prefix: Place,      entity_type: place,        description: "a named place that is not a street address, city or country (a landmark, a region, a venue)" }
    - { prefix: Org,        entity_type: organization,  description: "a company, institution, club or organisation name", primary_for_type: true }
    - { prefix: Thing,      entity_type: concept,       description: "an identifying thing that is not a product, brand, device, app or service (a project name, an internal code name)", primary_for_type: true }
    - { prefix: Product,    entity_type: concept,       description: "a product, brand, device, app or service name, including a named smart-home device" }
    - { prefix: Room,       entity_type: place,        description: "a room or area of a home" }
    - { prefix: Profession, entity_type: concept,       description: "a job title or profession" }
    - { prefix: Artist,     entity_type: person,       description: "a musician, band, author or performer name" }
    - { prefix: Work,       entity_type: concept,       description: "a song, album, film, book or show title" }
    - { prefix: Date,       entity_type: event,        description: "a calendar date, a weekday or month name, or a date of birth" }
    - { prefix: Other,      entity_type: person,       description: "any other proper noun or identifier that fits no listed kind" }
